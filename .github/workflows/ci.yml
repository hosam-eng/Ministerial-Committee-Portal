name: CI

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # APP_ENV is required server config — instrumentation validates it at
  # startup (next build/start), so CI declares it explicitly.
  APP_ENV: test

jobs:
  quality:
    name: Format, lint, architecture, types, unit/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Architecture boundary tests
        run: npm run test:architecture
      - name: Prisma client generation
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime platform unit tests
        run: npm run test:unit
      - name: Unit + component tests
        run: npm run test

  database:
    name: Prisma format/validate/generate, Testcontainers PostgreSQL 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Prisma schema format (fail if it would rewrite)
        run: npm run db:format && git diff --exit-code -- prisma/
      - name: Prisma schema validation
        run: npm run db:validate
      - name: Prisma client generation
        run: npm run db:generate
      - name: Testcontainers PostgreSQL 18 integration
        run: npm run test:db

  build-e2e:
    name: Production build, E2E smoke, accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # IMP-05: authentication E2E needs a real PostgreSQL 18 with the
      # repository's role bootstrap — same image/init files as the dev
      # compose setup and the Testcontainers suites. Runs after checkout
      # via compose (service bind mounts would resolve before checkout).
      - name: Start PostgreSQL 18 (dev compose)
        run: docker compose -f compose.dev.yml up -d --wait
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-prod-0123456789
          BETTER_AUTH_URL: http://127.0.0.1:3000
      - name: Apply migrations via the migration identity
        run: npm run db:migrate:deploy
        env:
          DATABASE_MIGRATION_URL: postgresql://mcp_migrate:mcp_migrate_dev@127.0.0.1:5432/mcp_dev
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (production server)
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://mcp_runtime:mcp_runtime_dev@127.0.0.1:5432/mcp_dev
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-prod-0123456789
          BETTER_AUTH_URL: http://127.0.0.1:3000
      - name: Accessibility smoke (axe)
        run: npm run test:a11y
        env:
          DATABASE_URL: postgresql://mcp_runtime:mcp_runtime_dev@127.0.0.1:5432/mcp_dev
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-prod-0123456789
          BETTER_AUTH_URL: http://127.0.0.1:3000
